  html, body { margin: 0; height: 100%; background: #050607; overscroll-behavior: none; }
  body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; overflow: hidden; font-family: Roboto, "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif;
    -webkit-font-smoothing: antialiased; color: #fff; }
  #app * { box-sizing: border-box; }
  .ll { display: flex; min-width: 0; }
  .ll.v { flex-direction: column; align-items: flex-start; }
  .ll.h { flex-direction: row; align-items: flex-start; }
  .ll.h.cv { align-items: center; }
  .ll.g-center { align-items: center; justify-content: center; }
  .tv { line-height: normal; white-space: pre-wrap; word-break: keep-all; }
  .tv.one { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  .frame { position: relative; }
  #app .fill { position: absolute; left: 0; top: 0; right: 0; bottom: 0; }
  .cv-host { position: relative; }
  .cv-host > canvas.fillcv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .has-bg { position: relative; }
  .has-bg > canvas.bgcv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; }
  .has-bg > :not(canvas) { position: relative; z-index: 1; }
  .stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .valve-abs { position: absolute !important; left: 46px; right: 46px; top: 50%; height: 26px; margin-top: -13px; }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .scroll > .ll { min-height: 100%; }
  .safe-pad { padding-top: calc(var(--pt, 16px) + env(safe-area-inset-top)) !important; }
  .nav { padding-bottom: env(safe-area-inset-bottom) !important; }
  .tap { cursor: pointer; }
  .tap:active { opacity: .72; }
  canvas.spin { animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 10px; }
  .overlay .dlg { width: 100%; max-width: 420px; max-height: calc(100% - 20px); overflow-y: auto; }
  input.num { width: 100%; box-sizing: border-box; background: #13161B; color: #fff; border: 1px solid #2F343A; border-radius: 12px;
    padding: 12px 14px; font: 16px Roboto, "Apple SD Gothic Neo", sans-serif; outline: none; -webkit-user-select: text; user-select: text; }
  input.num:focus { border-color: #A1C4EB; }
  input.search { min-width: 0; background: none; border: 0; outline: none; color: #fff; padding: 12px 0; font: 13px Roboto, "Apple SD Gothic Neo", sans-serif;
    -webkit-user-select: text; user-select: text; }
  input.search::placeholder { color: #5C6470; }
  input.pin { text-align: center; font-size: 28px; letter-spacing: 14px; padding: 14px; }
  .toast { position: absolute; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
    background: #2a2f36; color: #fff; padding: 11px 18px; border-radius: 22px; font-size: 13px; white-space: nowrap; }
</style>
