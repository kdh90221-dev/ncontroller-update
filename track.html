<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090b">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>주문 조회 · N Controller</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/site.css?v=99b293b2">
<link rel="stylesheet" href="assets/shop.css?v=db80377a">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html"><span class="mark" aria-hidden="true"></span>N CONTROLLER</a>
</div></header>
<main class="shop">
  <h1>주문 조회</h1>
  <div id="ask" hidden>
    <p class="lead">주문하실 때 적은 성함과 연락처로 찾을 수 있습니다.</p>
    <div class="box">
      <label>성함<input type="text" id="nm" autocomplete="name" placeholder="홍길동"></label>
      <label>연락처 뒤 4자리<input type="tel" id="p4" inputmode="numeric" maxlength="4" placeholder="1234"></label>
      <p class="msg" id="msg"></p>
      <button type="button" class="go" id="go">조회하기</button>
    </div>
    <p class="hint">주문하신 분의 성함과 연락처 뒤 4자리를 입력해 주세요. 찾지 못하면 카카오톡으로 문의해 주세요.</p>
  </div>
  <div id="out"><p class="lead">불러오는 중입니다…</p></div>
</main>
<footer><div class="wrap">
  <p style="font-size:13px;line-height:1.8">대표 김동현 · 이메일 <a href="mailto:kdh3486@naver.com">kdh3486@naver.com</a> · 카카오톡 상담 <a href="https://open.kakao.com/o/s6SgPQXi" target="_blank" rel="noopener">오픈채팅</a></p>
  <p>N Controller · ncontroller.kr</p>
</div></footer>
<script src="assets/shop.js?v=f487b877"></script>
<script>
(function () {
  var S = window.NCShop, out = document.getElementById('out'), ask = document.getElementById('ask');
  var k = new URLSearchParams(location.search).get('k') || '';
  var LIST = null;   // 성함으로 찾은 주문들 — 하나 열었다가 「목록」으로 돌아올 때

  function show(o, fromList) {
    ask.hidden = true;
    out.innerHTML = (fromList ? '<button type="button" class="back" id="back">‹ 주문 목록</button>' : '') +
      S.orderHead(o) + S.trackBox(o) + (o.state === '접수' ? S.payBox(o) : '') +
      ((o.state === '출고' || o.state === '배송' || o.state === '완료')
        ? '<div class="box"><h2>받은 뒤</h2><p class="hint" style="margin:0">설치 설명서를 보고 장착해 주세요.<br>' +
          '<a href="index.html#manual">설치 설명서</a> · <a href="index.html#download">앱 · 프로그램 다운로드</a></p></div>' : '') +
      S.afterBox();
    var bk = document.getElementById('back');
    if (bk) bk.onclick = function () { list(LIST); };
    window.scrollTo(0, 0);
  }

  var STATE = { '접수': '입금 대기', '입금': '입금 완료', '제작 중': '제작 중', '제작 완료': '발송 준비', '출고': '발송', '배송': '배송 중', '완료': '배송 완료', '취소': '취소', '환불': '환불' };

  function list(r) {
    LIST = r;
    ask.hidden = true;
    var html = '<p class="lead">' + S.esc(r.who) + ' 님 · 연락처 뒤 ' + S.esc(r.phone4) + ' · 주문 ' + r.orders.length + '건</p>';
    r.orders.forEach(function (o, i) {
      var sub = o.state === '접수' && o.due ? '입금 기한 ' + S.day(o.due) + '까지'
              : (o.state === '입금' && o.ship_note) ? o.ship_note
              : (o.ship_method === '방문 수령' || o.ship_method === '방문 설치') ? o.ship_method
              : o.invoice ? S.invoice(o.invoice).text : '';
      html += '<button type="button" class="olist" data-i="' + i + '">' +
        '<div class="top2"><span>' + S.esc(S.day(o.dates.order) || o.order_no) + '</span><b>' + S.esc(STATE[o.state] || o.state) + '</b></div>' +
        '<div class="nm">' + S.product(o) + '</div>' + (sub ? '<div class="sub2">' + S.esc(sub) + '</div>' : '') + '</button>';
    });
    out.innerHTML = html + '<p class="hint center">주문을 누르면 진행 상황과 입금 안내를 볼 수 있습니다.</p>' +
      '<button type="button" class="sub-go" id="again">다시 찾기</button>' + S.afterBox();
    [].forEach.call(out.querySelectorAll('.olist'), function (b) {
      b.onclick = function () { show(r.orders[+b.getAttribute('data-i')], true); };
    });
    document.getElementById('again').onclick = function () { form(''); };
    window.scrollTo(0, 0);
  }

  function form(text) {
    ask.hidden = false;
    out.innerHTML = '';
    document.getElementById('msg').textContent = text || '';
  }

  document.getElementById('go').onclick = function () {
    var nm = document.getElementById('nm').value.trim(), p4 = document.getElementById('p4').value.trim();
    var msg = document.getElementById('msg'), btn = this;
    if (!nm || !/^\d{4}$/.test(p4)) { msg.textContent = '성함과 연락처 뒤 4자리를 확인해 주세요.'; return; }
    btn.disabled = true; msg.textContent = '';
    S.call({ action: 'shop_order_track', name: nm, phone4: p4 }).then(function (r) {
      btn.disabled = false;
      if (r.result === 'success' && r.orders) return r.orders.length === 1 ? show(r.orders[0]) : list(r);
      msg.textContent = r.message || '주문을 찾지 못했습니다.';
    }, function () { btn.disabled = false; msg.textContent = '연결이 잠시 끊겼습니다. 다시 눌러 주세요.'; });
  };

  if (!k) return form('');
  S.call({ action: 'shop_order_track', k: k }).then(function (r) {
    if (r.result === 'success') return show(r);
    form(r.message);
  }, function () { form('불러오지 못했습니다. 잠시 뒤 다시 조회해 주세요.'); });
})();
</script>
</body>
</html>
